name: pulseops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops_dev
      POSTGRES_DB: pulseops
    ports:
      - '5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulseops']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
